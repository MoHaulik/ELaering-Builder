          html += '<label style="margin:0">Align: <select onchange="App.updateOverlay(\'text\','+t+',\'align\',this.value)" style="width:auto"><option value="center"'+((overlay.align||'center')==='center'?' selected':'')+'>Center</option><option value="left"'+((overlay.align||'center')==='left'?' selected':'')+'>Left</option><option value="right"'+((overlay.align||'center')==='right'?' selected':'')+'>Right</option></select></label>';
          html += '</div>';

          html += '<div class="slider-row">';
          html += '<label><div style="display:flex;justify-content:space-between"><span>Pos X</span><span>'+(overlay.x !== undefined ? overlay.x : 50)+'</span></div><input type="range" min="0" max="100" value="'+(overlay.x !== undefined ? overlay.x : 50)+'" oninput="this.previousElementSibling.children[1].textContent=this.value" onchange="App.updateOverlay(\'text\','+t+',\'x\',this.value)"></label>';
          html += '<label><div style="display:flex;justify-content:space-between"><span>Pos Y</span><span>'+(overlay.y !== undefined ? overlay.y : 50)+'</span></div><input type="range" min="0" max="100" value="'+(overlay.y !== undefined ? overlay.y : 50)+'" oninput="this.previousElementSibling.children[1].textContent=this.value" onchange="App.updateOverlay(\'text\','+t+',\'y\',this.value)"></label>';
          html += '<label><div style="display:flex;justify-content:space-between"><span>Size</span><span>'+(overlay.scale !== undefined ? overlay.scale : 1)+'</span></div><input type="range" min="0.5" max="3" step="0.1" value="'+(overlay.scale !== undefined ? overlay.scale : 1)+'" oninput="this.previousElementSibling.children[1].textContent=this.value" onchange="App.updateOverlay(\'text\','+t+',\'scale\',this.value)"></label>';
          html += '</div>';

          html += '</div>';
        }
      }
      html += '</div>';
      html += '<button class="btn secondary mini" style="width:100%; margin-top:8px;" onclick="App.addOverlay(\'text\')">+ Add Text Overlay</button>';
      html += '</div>';
    }

    if(node.type !== 'end') {
      // Question Section
      html += '<div class="field-group">';
      html += '<h3>' + icon('question', 14) + ' Question &amp; Navigation</h3>';
      html += '<label>Question (optional)</label>';
      html += '<textarea rows="2" placeholder="Ask a question..." onchange="App.updateNode(\'question\', this.value)">' + esc(node.question || '') + '</textarea>';

      // Per-node gaze dwell time (§4.1). Blank = use the 2.0s default. Author it here
      // so a scene with hard choices can demand a longer, deliberate hold.
      html += '<div class="overlay-controls" style="margin-top:8px;">';
      html += '<label style="margin:0" title="How long the learner must hold their gaze to select an answer. Blank = 2.0s default.">Gaze dwell (sec): <input type="number" step="0.1" min="0.5" max="10" placeholder="2.0" value="'+(node.gazeDwellSec !== undefined && node.gazeDwellSec !== null ? node.gazeDwellSec : '')+'" onchange="App.updateNode(\'gazeDwellSec\', this.value)"></label>';
      html += '</div>';

      if(node.question) {
        html += '<div class="overlay-controls" style="margin-top:8px; flex-wrap:wrap;">';
        // FIX #6: renamed from "Show Time" — same field, same behavior (it already
        // gates when the question/answers appear, exactly like an overlay's own
        // Start (sec)), but "Show Time" read as ambiguous/unclear in testing.
        // Unlike an overlay, a question has no Dur (sec): once it appears it stays
        // up until answered, so only a start time applies here.
        html += '<label style="margin:0" title="How many seconds into the video the question and its answers should appear. The video keeps playing until then — same idea as Start (sec) on an image or text overlay.">Appears at (sec): <input type="number" step="0.5" min="0" value="'+(node.questionTime !== undefined ? node.questionTime : 0)+'" onchange="App.updateNode(\'questionTime\', this.value)"></label>';
        html += '<label style="margin:0">Font size: <input type="number" step="2" min="10" max="200" style="width:70px" value="'+(node.questionFontSize !== undefined ? node.questionFontSize : 50)+'" onchange="App.updateNode(\'questionFontSize\', this.value)"></label>';
        html += '<label style="margin:0">Weight: <select onchange="App.updateNode(\'questionFontWeight\', this.value)" style="width:auto"><option value="normal"'+((node.questionFontWeight||'700')==='normal'?' selected':'')+'>Normal</option><option value="700"'+((node.questionFontWeight||'700')==='700'?' selected':'')+'>Bold</option></select></label>';
        html += '<label style="margin:0">Align: <select onchange="App.updateNode(\'questionAlign\', this.value)" style="width:auto"><option value="center"'+((node.questionAlign||'center')==='center'?' selected':'')+'>Center</option><option value="left"'+((node.questionAlign||'center')==='left'?' selected':'')+'>Left</option><option value="right"'+((node.questionAlign||'center')==='right'?' selected':'')+'>Right</option></select></label>';
        html += '</div>';

        html += '<div class="slider-row">';
        html += '<label><div style="display:flex;justify-content:space-between"><span>Pos X</span><span>'+(node.questionX !== undefined ? node.questionX : 50)+'</span></div><input type="range" min="0" max="100" value="'+(node.questionX !== undefined ? node.questionX : 50)+'" oninput="this.previousElementSibling.children[1].textContent=this.value" onchange="App.updateNode(\'questionX\', this.value)"></label>';
        html += '<label><div style="display:flex;justify-content:space-between"><span>Pos Y</span><span>'+(node.questionY !== undefined ? node.questionY : 50)+'</span></div><input type="range" min="0" max="100" value="'+(node.questionY !== undefined ? node.questionY : 50)+'" oninput="this.previousElementSibling.children[1].textContent=this.value" onchange="App.updateNode(\'questionY\', this.value)"></label>';
        html += '<label><div style="display:flex;justify-content:space-between"><span>Size</span><span>'+(node.questionScale !== undefined ? node.questionScale : 1)+'</span></div><input type="range" min="0.5" max="3" step="0.1" value="'+(node.questionScale !== undefined ? node.questionScale : 1)+'" oninput="this.previousElementSibling.children[1].textContent=this.value" onchange="App.updateNode(\'questionScale\', this.value)"></label>';
        html += '</div>';

        html += '<label style="margin-top:12px">Answer Choices</label>';
        html += '<div class="overlay-list">';
        
        for(var k = 0; k < node.choices.length; k++) {
          var c = node.choices[k];
          var cBg = c.bgColor || '#0969da', cTxt = c.textColor || '#ffffff', cScale = (c.scale !== undefined ? c.scale : 1);
          html += '<div class="overlay-item">';
          html += '<div class="overlay-controls" style="flex-wrap:nowrap;">';
          html += '<input type="checkbox" title="Correct answer"' + (c.correct ? ' checked' : '') + ' onchange="App.updateChoice(' + k + ', \'correct\', this.checked)" style="width:auto;">';
          html += '<input type="text" value="' + esc(c.label) + '" placeholder="Answer..." onchange="App.updateChoice(' + k + ', \'label\', this.value)" style="flex:1;">';
          html += '<select title="Navigate to" onchange="App.updateChoice(' + k + ', \'target\', this.value)" style="width:100px;">';
          html += '<option value="">→ Default</option>';
          for(var m = 0; m < this.project.nodes.length; m++) {
            var n = this.project.nodes[m];
            if(n.id !== node.id) {
              html += '<option value="' + n.id + '"' + (c.target === n.id ? ' selected' : '') + '>' + esc(n.title) + '</option>';
            }
          }
          html += '</select>';
          html += '<button class="overlay-remove" style="margin-left:0;" onclick="App.removeChoice(' + k + ')">×</button>';
          html += '</div>';
          // Answer-option formatting (§5.1): background colour, text colour, size.
          html += '<div class="overlay-controls" style="margin-top:6px; flex-wrap:wrap;">';
          html += '<label style="margin:0; display:flex; align-items:center; gap:4px;" title="Answer background">BG: <input type="color" list="colorPresets" value="'+esc(cBg)+'" onchange="App.updateChoice('+k+', \'bgColor\', this.value)"></label>';
          html += '<label style="margin:0; display:flex; align-items:center; gap:4px;" title="Answer text colour">Txt: <input type="color" list="colorPresets" value="'+esc(cTxt)+'" onchange="App.updateChoice('+k+', \'textColor\', this.value)"></label>';
          html += '<label style="margin:0; flex:1; min-width:120px;"><div style="display:flex;justify-content:space-between;font-weight:normal"><span>Size</span><span>'+cScale+'</span></div><input type="range" min="0.5" max="2" step="0.1" value="'+cScale+'" oninput="this.previousElementSibling.children[1].textContent=this.value" onchange="App.updateChoice('+k+', \'scale\', this.value)"></label>';
          html += '</div>';
          html += '</div>';
        }

        html += '</div>';
        html += '<button class="btn secondary mini" style="width:100%; margin-top:8px;" onclick="App.addChoice()">+ Add Choice</button>';
      }
      
      html += '<label style="margin-top:12px">Default Next Node (if no question / no selection)</label>';
      html += '<select onchange="App.updateNode(\'defaultNext\', this.value)">';
      html += '<option value="">None (End Scenario)</option>';
      for(var q = 0; q < this.project.nodes.length; q++) {
        var nav = this.project.nodes[q];
        if(nav.id !== node.id) {
          html += '<option value="' + nav.id + '"' + (node.defaultNext === nav.id ? ' selected' : '') + '>' + esc(nav.title) + '</option>';
        }
      }
      html += '</select>';

      // Direct vs. smooth transition (spec ID:02_09/02_10) — governs choices AND
      // the default/auto-advance link out of this node.
      html += '<label style="margin-top:12px">Transition to next node</label>';
      html += '<select onchange="App.updateNode(\'transition\', this.value)">';
      html += '<option value="smooth"' + (node.transition !== 'direct' ? ' selected' : '') + '>Smooth (fade)</option>';
      html += '<option value="direct"' + (node.transition === 'direct' ? ' selected' : '') + '>Direct (instant cut)</option>';
      html += '</select>';
      html += '</div>';
    }

    html += '<div class="field-group">';
    html += '<h3>' + icon('bolt', 14) + ' Actions</h3>';
    html += '<div class="quick-actions">';
    html += '<button class="action-btn" onclick="App.previewFromNode()">' + icon('play', 12) + ' Preview from Here</button>';
    html += '<button class="action-btn" onclick="App.duplicateNode()">' + icon('copy', 12) + ' Duplicate</button>';
    html += '<button class="action-btn" onclick="App.deleteNode()" style="color:var(--red)">' + icon('trash', 12) + ' Delete</button>';
    if(this.project.startNode !== node.id) {
      html += '<button class="action-btn" onclick="App.setStart()">' + icon('play', 12) + ' Set Start</button>';
    }
    html += '</div>';
    html += '</div>';
    
    inspector.innerHTML = html;
    inspector.classList.add('active');
  },
  
  updateNode: function(prop, value) {
    if(!this.selectedNode) return;

    if(['duration', 'questionTime', 'questionX', 'questionY', 'questionScale', 'questionFontSize'].includes(prop)) {
        value = parseFloat(value) || 0;
    } else if(prop === 'gazeDwellSec') {
        // Blank means "use the default" — store '' rather than a bogus 0.
        value = (value === '' || value == null) ? '' : (parseFloat(value) || '');
    }

    this.selectedNode[prop] = value;
    
    if(prop === 'question') {
      if(value && (!this.selectedNode.choices || this.selectedNode.choices.length===0)) {
        this.selectedNode.choices = [
          { id: 'c' + Date.now() + '1', label: 'Option A', correct: true, target: null },
          { id: 'c' + Date.now() + '2', label: 'Option B', correct: false, target: null }
        ];
      }
      this.showInspector(this.selectedNode);
    }
    
    this.createNodeElement(this.selectedNode);
    this.updateConnections();
    this.saveState();
  },

  addOverlay: function(type) {
    if(!this.selectedNode) return;
    if(type === 'image') {
        if(!this.selectedNode.imageOverlays) this.selectedNode.imageOverlays = [];
        this.selectedNode.imageOverlays.push({ imageId: '', time: 0, duration: 5, x: 50, y: 50, scale: 1.0 });
    } else {
        if(!this.selectedNode.textOverlays) this.selectedNode.textOverlays = [];
        this.selectedNode.textOverlays.push({ time: 0, duration: 3, text: '', color: '#ffffff', textColor: '#000000', x: 50, y: 50, scale: 1.0 });
    }
    this.showInspector(this.selectedNode);
    this.createNodeElement(this.selectedNode);
    this.saveState();
  },

  updateOverlay: function(type, idx, prop, value) {
    if(!this.selectedNode) return;
    var list = type === 'image' ? this.selectedNode.imageOverlays : this.selectedNode.textOverlays;
    if(!list || !list[idx]) return;

    if(['time', 'duration', 'x', 'y', 'scale', 'fontSize'].includes(prop)) {
        value = parseFloat(value) || 0;
    }
    if(prop === 'color') value = safeColor(value, '#ffffff');
    if(prop === 'textColor') value = safeColor(value, '#000000');
    list[idx][prop] = value;

    if(prop === 'color' || prop === 'textColor' || prop === 'imageId') {
        this.showInspector(this.selectedNode); // Refresh colors/selects
    }
    this.createNodeElement(this.selectedNode);
    this.saveState();
  },

  removeOverlay: function(type, idx) {
    if(!this.selectedNode) return;
    var list = type === 'image' ? this.selectedNode.imageOverlays : this.selectedNode.textOverlays;
    if(list) list.splice(idx, 1);
    this.showInspector(this.selectedNode);
    this.createNodeElement(this.selectedNode);
    this.saveState();
  },

  // Audio narration (spec ID:01_12).
  updateNarration: function(prop, value) {
    if(!this.selectedNode) return;
    if(!this.selectedNode.narration) this.selectedNode.narration = { file: '', startTime: 0 };
    if(prop === 'startTime') value = parseFloat(value) || 0;
    this.selectedNode.narration[prop] = value;
    if(prop === 'file' && !value) this.selectedNode.narration = null;
    this.showInspector(this.selectedNode);
    this.saveState();
  },

  // Mid-video waypoints (spec ID:01_13).
  addWaypoint: function() {
    if(!this.selectedNode) return;
    if(!this.selectedNode.waypoints) this.selectedNode.waypoints = [];
    this.selectedNode.waypoints.push({ label: '', target: '', time: 0, duration: 6, x: 50, y: 50 });
    this.showInspector(this.selectedNode);
    this.saveState();
  },
  updateWaypoint: function(idx, prop, value) {
    if(!this.selectedNode || !this.selectedNode.waypoints || !this.selectedNode.waypoints[idx]) return;
    if(['time', 'duration', 'x', 'y'].includes(prop)) value = parseFloat(value) || 0;
    this.selectedNode.waypoints[idx][prop] = value;
    this.createNodeElement(this.selectedNode);
    this.saveState();
  },
  removeWaypoint: function(idx) {
    if(!this.selectedNode || !this.selectedNode.waypoints) return;
    this.selectedNode.waypoints.splice(idx, 1);
    this.showInspector(this.selectedNode);
    this.saveState();
  },

  updateChoice: function(idx, prop, value) {
    if(!this.selectedNode || !this.selectedNode.choices[idx]) return;
    if(prop === 'scale') value = num(value, 1, 0.3, 3);
    if(prop === 'bgColor') value = safeColor(value, '#0969da');
    if(prop === 'textColor') value = safeColor(value, '#ffffff');
    this.selectedNode.choices[idx][prop] = value;
    this.updateConnections();
    this.saveState();
  },
  
  addChoice: function() {
    if(!this.selectedNode) return;
    if(!this.selectedNode.choices) this.selectedNode.choices = [];
    this.selectedNode.choices.push({ id: 'c' + Date.now(), label: 'New Option', correct: false, target: null });
    this.showInspector(this.selectedNode);
    this.saveState();
  },
  
  removeChoice: function(idx) {
    if(!this.selectedNode || !this.selectedNode.choices) return;
    this.selectedNode.choices.splice(idx, 1);
    this.showInspector(this.selectedNode);
    this.saveState();
  },
  
  deleteNode: function() {
    if(!this.selectedNode) return;
    var id = this.selectedNode.id;
    
    this.project.nodes = this.project.nodes.filter(function(n) { return n.id !== id; });
    this.project.nodes.forEach(function(n) {
      if(n.defaultNext === id) n.defaultNext = null;
      if(n.choices) {
        n.choices.forEach(function(c) {
          if(c.target === id) c.target = null;
        });
      }
    });
    
    var el = document.getElementById(id);
    if(el) el.remove();
    
    if(this.project.startNode === id) {
      this.project.startNode = this.project.nodes[0] ? this.project.nodes[0].id : null;
    }
    
    this.deselect();
    this.updateConnections();
    this.updateStats();
    this.fitView();
    this.saveState();
  },

  setStart: function() {
    if(!this.selectedNode) return;
    this.project.startNode = this.selectedNode.id;
    var nodes = document.querySelectorAll('.node');
    for(var i = 0; i < nodes.length; i++) {
      nodes[i].classList.remove('start');
    }
    document.getElementById(this.selectedNode.id).classList.add('start');
    this.showInspector(this.selectedNode);
    this.saveState();
  },
  
  duplicateNode: function() {
    if(!this.selectedNode) return;
    var copy = JSON.parse(JSON.stringify(this.selectedNode));
    copy.id = 'node_' + Date.now() + Math.random().toString(36).substr(2,4);
    copy.x += 60;
    copy.y += 60;
    copy.title += ' (Copy)';
    if(copy.choices) {
      copy.choices.forEach(function(c) {
        c.id = 'c' + Date.now() + Math.random().toString(36).substr(2,4);
      });
    }
    this.project.nodes.push(copy);
    this.createNodeElement(copy);
    this.updateConnections();
    this.updateStats();
    this.fitView();
    this.saveState();
  },
  
  // ---- CANVAS, DRAG & VIEW (FIX #3) ----
  // Transform model: screen = world * view.scale + view.(x,y), origin 0 0.
  // getBoundingClientRect() of #canvas already includes the pan translation,
  // so cursor → world is just (client - rect) / scale.
  startDrag: function(e, node) {
    // BUGFIX: same class of bug as the canvas-pan handler above — mousedown
    // preventDefault() suppresses blur on whatever inspector field is
    // currently focused (e.g. editing a choice label on this node, or any
    // node), silently discarding the pending edit once selectNode() rebuilds
    // the inspector for the node being dragged. Flush it first.
    var _active = document.activeElement;
    if (_active && _active !== document.body && typeof _active.blur === 'function' && (_active.tagName === 'INPUT' || _active.tagName === 'TEXTAREA' || _active.tagName === 'SELECT')) {
      _active.blur();
    }
    e.preventDefault();
    this.dragging = node;
    var rect = e.target.closest('.node').getBoundingClientRect();
    // Screen px → world px: unscale the grab offset or the node jumps under
    // the cursor at any zoom level other than 100%.
    this.dragOffset = {
      x: (e.clientX - rect.left) / this.view.scale,
      y: (e.clientY - rect.top) / this.view.scale
    };
    
    var self = this;
    var moveHandler = function(e) { self.onDrag(e); };
    var upHandler = function() {
      self.dragging = null;
      document.removeEventListener('mousemove', moveHandler);
      document.removeEventListener('mouseup', upHandler);
      self.saveState();
    };
    
    document.addEventListener('mousemove', moveHandler);
    document.addEventListener('mouseup', upHandler);
  },
  
  onDrag: function(e) {
    if(!this.dragging) return;
    var canvas = document.getElementById('canvas').getBoundingClientRect();
    var s = this.view.scale;
    // Clamp ≥ 0 so a node can never be flung into unrecoverable negative space.
    this.dragging.x = Math.max(0, (e.clientX - canvas.left) / s - this.dragOffset.x);
    this.dragging.y = Math.max(0, (e.clientY - canvas.top) / s - this.dragOffset.y);
    
    var el = document.getElementById(this.dragging.id);
    if(el) {
        el.style.left = this.dragging.x + 'px';
        el.style.top = this.dragging.y + 'px';
    }
    
    this.updateConnections();
  },

  initPanZoom: function() {
    var self = this;
    var wrap = document.querySelector('.canvas-wrap');

    // Pan: left/middle-drag on empty canvas. A "pan" under 4px of travel is a
    // click → deselect (replaces the old canvas click listener, which would
    // otherwise deselect after every pan gesture).
    wrap.addEventListener('mousedown', function(e) {
      if (e.button !== 0 && e.button !== 1) return;
      if (e.target.closest('.node') || e.target.closest('.add-menu') || e.target.closest('.view-controls')) return;
      // BUGFIX: mousedown preventDefault() below suppresses the browser's default
      // focus-change behaviour, so an inspector field left focused (its pending
      // edit only commits via onchange-on-blur) never blurs, and its typed value
      // is silently discarded once deselect() rebuilds the panel. Force the
      // commit ourselves before suppressing the default action.
      var _active = document.activeElement;
      if (_active && _active !== document.body && typeof _active.blur === 'function' && (_active.tagName === 'INPUT' || _active.tagName === 'TEXTAREA' || _active.tagName === 'SELECT')) {
        _active.blur();
      }
      e.preventDefault();
      var startX = e.clientX, startY = e.clientY;
      var origX = self.view.x, origY = self.view.y;
      var moved = false;
      wrap.classList.add('panning');
      var move = function(ev) {
        var dx = ev.clientX - startX, dy = ev.clientY - startY;
        if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
        self.view.x = origX + dx;
        self.view.y = origY + dy;
        self.applyView();
      };
      var up = function() {
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
        wrap.classList.remove('panning');
        if (!moved) self.deselect();
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
    });

    // Wheel zoom, anchored on the cursor.
    wrap.addEventListener('wheel', function(e) {
      e.preventDefault();
      var rect = wrap.getBoundingClientRect();
      self.zoomAt(e.deltaY < 0 ? 1.1 : 1/1.1, e.clientX - rect.left, e.clientY - rect.top);
    }, { passive: false });
  },

  applyView: function() {
    document.getElementById('canvas').style.transform =
      'translate(' + this.view.x + 'px,' + this.view.y + 'px) scale(' + this.view.scale + ')';
    var z = document.getElementById('zoomLabel');
    if (z) z.textContent = Math.round(this.view.scale * 100) + '%';
  },

  zoomAt: function(factor, px, py) {
    // Keep the world point under (px, py) stationary while scaling.
    var old = this.view.scale;
    var next = Math.min(2.5, Math.max(0.2, old * factor));
    this.view.x = px - (px - this.view.x) * (next / old);
    this.view.y = py - (py - this.view.y) * (next / old);
    this.view.scale = next;
    this.applyView();
  },

  zoomBy: function(factor) {
    var wrap = document.querySelector('.canvas-wrap');
    this.zoomAt(factor, wrap.clientWidth / 2, wrap.clientHeight / 2);
  },

  fitView: function() {
    var wrap = document.querySelector('.canvas-wrap');
    var ns = this.project.nodes;
    if (!ns.length) { this.resetView(); return; }
    // FIX #5.3 — never fit against a not-yet-laid-out (0px) container; that is what
    // produced the 20% sliver. Just apply the current view and let the deferred
    // fit / ResizeObserver retry once a real size exists.
    if (!wrap || wrap.clientWidth === 0 || wrap.clientHeight === 0) { this.applyView(); return; }
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    ns.forEach(function(n) {
      minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
      maxX = Math.max(maxX, n.x + 140); maxY = Math.max(maxY, n.y + 180);
    });
    var pad = 60;
    var s = Math.min(
      (wrap.clientWidth - pad * 2) / Math.max(1, maxX - minX),
      (wrap.clientHeight - pad * 2) / Math.max(1, maxY - minY),
      1.25
    );
    s = Math.max(0.2, Math.min(2.5, s));
    this.view.scale = s;
    this.view.x = (wrap.clientWidth - (maxX - minX) * s) / 2 - minX * s;
    this.view.y = (wrap.clientHeight - (maxY - minY) * s) / 2 - minY * s;
    this.applyView();
  },

  resetView: function() {
    this.view = { x: 0, y: 0, scale: 1 };
    this.applyView();
  },
  
  updateConnections: function() {
    var oldConns = document.querySelectorAll('.connection');
    for(var i = 0; i < oldConns.length; i++) {
      oldConns[i].remove();
    }
    
    var self = this;
    var connectionCount = 0;
    
    this.project.nodes.forEach(function(node) {
      if(node.defaultNext) {
        self.drawConnection(node.id, node.defaultNext, 'default');
        connectionCount++;
      }
      if(node.choices) {
        node.choices.forEach(function(choice) {
          if(choice.target) {
            self.drawConnection(node.id, choice.target, choice.correct ? 'correct' : 'incorrect');
            connectionCount++;
          }
        });
      }
    });
    
    document.getElementById('connectionCount').textContent = connectionCount;
  },
  
  drawConnection: function(fromId, toId, type) {
    // FIX #3: endpoints come from MODEL coordinates, not getBoundingClientRect.
    // The SVG lives inside #canvas, so the pan/zoom transform applies to it for
    // free and the old screen-space rect math (which double-transformed under
    // zoom and depended on layout flushes mid-drag) is gone. Node cards are a
    // circle of diameter 140 sitting at the top of the card → centre is x+70 / y+70.
    var from = this.project.nodes.find(function(n) { return n.id === fromId; });
    var to = this.project.nodes.find(function(n) { return n.id === toId; });
    if(!from || !to) return;

    var x1 = from.x + 70, y1 = from.y + 70;
    var x2 = to.x + 70,   y2 = to.y + 70;
    
    var container = document.createElement('div');
    container.className = 'connection ' + type;
    
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    
    var dx = x2 - x1;
    var c1x = x1 + dx * 0.3;
    var c1y = y1;
    var c2x = x2 - dx * 0.3;
    var c2y = y2;
    
    var d = 'M ' + x1 + ' ' + y1 + ' C ' + c1x + ' ' + c1y + ', ' + c2x + ' ' + c2y + ', ' + x2 + ' ' + y2;
    path.setAttribute('d', d);
    
    svg.appendChild(path);
    container.appendChild(svg);
    document.getElementById('canvas').appendChild(container);
  },
  
  // ---- ASSETS ----
  addVideos: function(e) {
    var self = this;
    var files = Array.from(e.target.files);
    if(files.length === 0) return;
    
    files.forEach(function(file) {
      var url = URL.createObjectURL(file);
      var asset = {
        id: 'v' + Date.now() + Math.random().toString(36).substr(2,4),
        name: file.name,
        fileObj: file, // Keep the real File alive in memory for this session
        url: url,
        thumb: null
      };
      // FIX #1: push the asset IMMEDIATELY and unconditionally. The old code
      // pushed inside generateThumb().then(); for HEVC/H.265 clips (common from
      // 360 cameras) Chrome fires neither loadeddata nor error, the promise
      // never settled, and the clip silently vanished after "Added 1 video(s)".
      // The thumbnail is now a cosmetic upgrade that lands later — or never.
      self.project.assets.videos.push(asset);
      
      self.generateThumb(url).then(function(thumb) {
        if (!thumb) return; // no preview frame — asset still fully usable
        // Look the asset up by id: undo/redo clones objects, so the closure
        // reference may be stale by the time the thumbnail arrives.
        var a = self.project.assets.videos.find(function(v) { return v.id === asset.id; });
        if (!a) return; // deleted/undone meanwhile
        a.thumb = thumb;
        self.updateAssetLists();
        self.project.nodes.forEach(function(n) { if (n.video === a.id) self.createNodeElement(n); });
      });
    });
    
    this._assetsNeedRelink = false;
    this.updateAssetLists();
    this.saveState();
    this.showStatus('Added ' + files.length + ' video(s)');
    e.target.value = '';
  },
  
  addImages: function(e) {
    var files = Array.from(e.target.files);
    var self = this;
    if(files.length === 0) return;

    files.forEach(function(file) {
      var url = URL.createObjectURL(file);
      self.project.assets.images.push({
        id: 'i' + Date.now() + Math.random().toString(36).substr(2,4),
        name: file.name,
        fileObj: file,
        url: url
      });
      self.updateAssetLists();
      self.saveState();
    });
    
    this.showStatus('Added ' + files.length + ' image(s)');
    e.target.value = '';
  },

  // Audio narration clips (spec ID:01_12A) — parallel to addImages, no thumbnail.
  addAudios: function(e) {
    var files = Array.from(e.target.files);
    var self = this;
    if(files.length === 0) return;
    if (!this.project.assets.audio) this.project.assets.audio = [];

    files.forEach(function(file) {
      var url = URL.createObjectURL(file);
      self.project.assets.audio.push({
        id: 'a' + Date.now() + Math.random().toString(36).substr(2,4),
        name: file.name,
        fileObj: file,
        url: url
      });
      self.updateAssetLists();
      self.saveState();
    });

    this.showStatus('Added ' + files.length + ' audio clip(s)');
    e.target.value = '';
  },

  // In-editor video compression (spec ID:01_08). Re-encodes to WebM/VP9 at a
  // fixed 2.5 Mbps ceiling and a 1920px width cap by drawing the source video
  // frame-by-frame to a canvas and recording that canvas + the original audio
  // track — no external transcoder, only native browser APIs. Runs in
  // real time (as long as the clip itself), which is the trade-off for not
  // shipping a wasm encoder.
  compressVideo: function(assetId) {
    var self = this;
    var v = this.project.assets.videos.find(function(x) { return x.id === assetId; });
    if (!v || !v.url) { alert('Video not available — re-load the .zip first.'); return; }
    if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) {
      alert('Video compression needs MediaRecorder + canvas.captureStream, not available in this browser.');
      return;
    }
    var video = document.createElement('video');
    video.src = v.url; video.muted = false; video.playsInline = true;
    video.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:2px;height:2px;';
    document.body.appendChild(video);

    video.addEventListener('loadedmetadata', function() {
      var targetW = Math.min(1920, video.videoWidth || 1920);
      var scale = targetW / (video.videoWidth || targetW);
      var canvas = document.createElement('canvas');
      canvas.width = targetW;
      canvas.height = Math.round((video.videoHeight || 960) * scale) || 960;
      var ctx = canvas.getContext('2d');

      var tracks = canvas.captureStream(30).getVideoTracks();
      if (video.captureStream) tracks = tracks.concat(video.captureStream().getAudioTracks());
      var mixed = new MediaStream(tracks);
      var mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus') ? 'video/webm;codecs=vp9,opus' : 'video/webm';
      var rec = new MediaRecorder(mixed, { mimeType: mimeType, videoBitsPerSecond: 2500000 });
      var chunks = [];
      rec.ondataavailable = function(e) { if (e.data.size) chunks.push(e.data); };
      rec.onstop = function() {
        try { video.remove(); } catch(e) {}
        var blob = new Blob(chunks, { type: 'video/webm' });
        if (v.url && v.url.indexOf('blob:') === 0) URL.revokeObjectURL(v.url);
        var newName = v.name.replace(/\.[^.]+$/, '') + '_compressed.webm';
        v.fileObj = new File([blob], newName, { type: 'video/webm' });
        v.name = newName;
        v.url = URL.createObjectURL(v.fileObj);
        v._compressed = true;
        self.generateThumb(v.url).then(function(t) {
          v.thumb = t;
          self.updateAssetLists();
          self.project.nodes.forEach(function(n) { if (n.video === assetId) self.createNodeElement(n); });
        });
        self.saveState();
        self.showStatus('Compressed: ' + newName);
      };

      var drawFrame = function() {
        if (video.paused || video.ended) return;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        requestAnimationFrame(drawFrame);
      };
      video.addEventListener('play', function() { rec.start(); drawFrame(); }, { once: true });
      video.addEventListener('ended', function() { rec.stop(); });
      self.showStatus('Compressing ' + v.name + '… this takes as long as the clip.');
      video.currentTime = 0;
      video.play().catch(function() { alert('Could not start compression playback.'); try { video.remove(); } catch(e) {} });
    });
    video.addEventListener('error', function() { alert('Could not load this video for compression.'); try { video.remove(); } catch(e) {} });
  },

  generateThumb: function(videoUrl) {
    // FIX #1 + #2 (original): this promise always settles, and it grabs a real
    // frame rather than a black frame-0 capture.
    // FIX #3 (thumbnails silently missing on real 360 footage): two changes on
    // top of the above, root-caused after real authored builds kept coming
    // back with every node thumbnail-less:
    //  - the 3s killswitch was too tight once 3-4 large 360 clips all start
    //    decoding at once (real camera exports, not test stock clips) —
    //    decoder-slot contention alone can blow past 3s before metadata even
    //    loads. Bumped to 8s, and it's still a killswitch, not a hang: the
    //    asset was already pushed to the project before this ever runs (§FIX#1
    //    above), so a slow/failed thumb never blocks authoring.
    //  - a detached (never-attached-to-the-DOM) <video> is exactly the
    //    pattern some Chromium builds decode least reliably — seek callbacks
    //    can simply never fire for an element that was never part of the
    //    render tree, with no error either. The element is now appended
    //    (invisible, zero footprint) for the duration of the capture.
    //  - added a 'loadeddata' fallback: if the explicit mid-point seek
    //    doesn't produce a 'seeked' within 1.5s of first-frame-available, draw
    //    whatever frame IS on screen instead of waiting out the full
    //    killswitch for nothing — a slightly-off thumbnail beats no
    //    thumbnail.
    return new Promise(function(resolve) {
      var video = document.createElement('video');
      video.muted = true;
      video.preload = 'auto';
      video.playsInline = true;
      video.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:2px;height:2px;opacity:0;pointer-events:none;';
      document.body.appendChild(video);

      var done = false;
      var fallbackTimer = null;
      var finish = function(result) {
        if (done) return;
        done = true;
        clearTimeout(killswitch);
        clearTimeout(fallbackTimer);
        // Release the decoder slot (same rationale as the preview cleanup).
        try { video.removeAttribute('src'); video.load(); } catch(e) {}
        try { video.remove(); } catch(e) {}
        resolve(result);
      };
      var grab = function() {
        try {
          var canvas = document.createElement('canvas');
          canvas.width = 320;
          canvas.height = 180;
          canvas.getContext('2d').drawImage(video, 0, 0, 320, 180);
          finish(canvas.toDataURL('image/jpeg', 0.5));
        } catch(e) { finish(null); }
      };
      var killswitch = setTimeout(function() { finish(null); }, 8000);

      video.src = videoUrl;

      video.addEventListener('loadedmetadata', function() {
        try {
          video.currentTime = Math.min(1, (video.duration || 2) / 2);
        } catch(e) { finish(null); }
      });
      video.addEventListener('loadeddata', function() {
        // First frame is decodable — if the mid-point seek stalls, don't
        // waste the rest of the 8s killswitch on nothing.
        if (!fallbackTimer) fallbackTimer = setTimeout(grab, 1500);
      });
      video.addEventListener('seeked', grab);
      video.addEventListener('error', function() { finish(null); });
    });
  },
  
  updateAssetLists: function() {
    document.getElementById('videoCount').textContent = this.project.assets.videos.length;
    document.getElementById('imageCount').textContent = this.project.assets.images.length;
    document.getElementById('audioCount').textContent = (this.project.assets.audio || []).length;

    var relink = this._assetsNeedRelink ? ' <span style="color:var(--red)">(re-load .zip)</span>' : '';

    var vList = document.getElementById('videoList');
    if(this.project.assets.videos.length > 0) {
        vList.innerHTML = this.project.assets.videos.map(v => `
          <div class="asset-item-row" title="${esc(v.name)}" style="display:block;">
            <div>${icon('video', 12)} ${esc(v.name)}${(!v.fileObj && this._assetsNeedRelink)?relink:''}${v._compressed?' <span style="color:var(--green)">(compressed)</span>':''}</div>
            <div style="display:flex;gap:6px;align-items:center;margin-top:4px;">
              <select style="width:auto;font-size:11px;padding:3px 6px;" title="Projection (spec ID:01_07)" onchange="App.setVideoProjection('${v.id}', this.value)">
                <option value="360"${v.projection!=='180'?' selected':''}>360°</option>
                <option value="180"${v.projection==='180'?' selected':''}>180°</option>
              </select>
              <button class="btn secondary mini" onclick="App.compressVideo('${v.id}')" title="Re-encode at a lower bitrate (spec ID:01_08)">${icon('compress', 12)} Compress</button>
            </div>
          </div>`).join('');
    } else {
        vList.innerHTML = '<i>No videos uploaded yet</i>';
    }

    var iList = document.getElementById('imageList');
    if(this.project.assets.images.length > 0) {
        iList.innerHTML = this.project.assets.images.map(i => `<div class="asset-item-row" title="${esc(i.name)}">${icon('image', 12)} ${esc(i.name)}${(!i.fileObj && this._assetsNeedRelink)?relink:''}</div>`).join('');
    } else {
        iList.innerHTML = '<i>No images uploaded yet</i>';
    }

    var aList = document.getElementById('audioList');
    var audioAssets = this.project.assets.audio || [];
    if(audioAssets.length > 0) {
        aList.innerHTML = audioAssets.map(a => `<div class="asset-item-row" title="${esc(a.name)}">${icon('audio', 12)} ${esc(a.name)}${(!a.fileObj && this._assetsNeedRelink)?relink:''}</div>`).join('');
    } else {
        aList.innerHTML = '<i>No audio uploaded yet</i>';
    }
  },

    if (!v) return;

  // ---- PREVIEW SYSTEM ----
  preview: function() {
    var startNode = this.project.nodes.find(n => n.id === this.project.startNode);
    if(!startNode) {
      this.showStatus('Please set a start node first');
      return;
    }

    // BUGFIX: opening Preview while a previous preview session's overlay timer was
    // still alive (e.g. clicking "Preview" twice, or reopening it without a clean
    // close) used to REPLACE this.previewState wholesale right here, one line
    // before cleanupPreviewTimers() runs inside renderPreviewNode(). By the time
    // that cleanup ran it was reading the *new* (blank) state's overlayTimer, so
    // it could never reach the *old* running interval to clear it -- the old
    // interval kept ticking forever, racing the new one. With N leaked intervals
    // all advancing the same timeline/clock every 100ms, the scene clock and
    // timed overlays ran N times too fast: text and question overlays could
    // expire before they were ever seen (reported as "black background, text
    // box not showing"), and rapid overlapping re-renders of the choice buttons
    // produced the "marked and then not marked" flicker on click. Clearing the
    // OLD state's timer BEFORE replacing previewState fixes this at the source.
    if (this.previewState) this.cleanupPreviewTimers();
    this._resetPreviewFrame();

    this.previewState = {
      currentNode: startNode,
      history: [],
      videoTime: 0,
      overlayTimer: null,
      videoFailed: false
    };

    document.getElementById('previewModal').classList.add('show');
    document.getElementById('previewTitle').textContent = 'Preview: ' + this.project.title;
    this.renderPreviewNode(startNode);
  },

  // NEW FEATURE: preview a scenario starting from any node, not just the
  // official start node. Requested so an author working deep in a large
  // branching tree (e.g. the 99-node stress test) doesn't have to click
  // through from the very beginning every time they just want to check one
  // node onward. Shares all the same rendering/timer machinery as preview()
  // -- it only differs in which node it hands to renderPreviewNode() and in
  // starting with empty history (so "Back" has nothing to return to, same as
  // a normal preview would at its own start node).
  previewFromNode: function(node) {
    if (!node) node = this.selectedNode;
    if (!node) {
      this.showStatus('Select a node first');
      return;
    }
    if (this.previewState) this.cleanupPreviewTimers();
    this._resetPreviewFrame();
    this.previewState = {
      currentNode: node,
      history: [],
      videoTime: 0,
      overlayTimer: null,
      videoFailed: false
    };
    document.getElementById('previewModal').classList.add('show');
    document.getElementById('previewTitle').textContent = 'Preview: ' + this.project.title + ' — from "' + esc(node.title || 'Untitled') + '"';
    this.renderPreviewNode(node);
  },

  // A top-level "Preview" click (as opposed to Back/Restart/Continue, or a
  // real choice-click *inside* the embedded Player, which all reuse the
  // current session on purpose) must ALWAYS get a genuinely fresh embedded
  // Player. Without this, clicking Preview again while the previous iframe's
  // run had already finished on its own (onSessionEnd already fired,
  // reverting it to its own upload/setup screen) reused that dead iframe:
  // renderPreviewNode() saw an iframe already existed, sent it a lxrPreviewGoto
  // instead of a fresh lxrPreviewLoad, and the Player's own raw setup screen
  // ("Click to Upload Scenario" / "Enter Immersive VR") stayed visible right
  // inside the Builder's preview panel -- exactly the kind of leaked Player
  // chrome that must never surface here. Tearing the iframe down first
  // guarantees every top-level Preview open starts a clean session.
  _resetPreviewFrame: function() {
    var iframe = document.getElementById('previewPlayerFrame');
    if (iframe) iframe.remove();
    this._previewLoaded = false;
    this._stopPreviewLiveSync();
  },

  // REAL FIX: this used to be a second, hand-rolled flat HTML/CSS renderer —
  // its own text-box sizing, its own choice-button layout, no representation
  // of the exit button at all. It matched the headset by resemblance, not by
  // construction, which is exactly why it drifted (text clipping, tiny answer
  // buttons, choices landing on the exit control never showed up here even
  // though they did on a real Quest). Preview now embeds the Player's own
  // page in an iframe running its existing "no headset" flatPreview mode and
  // drives it over postMessage — the preview IS the Player, so it can't drift.
  PLAYER_PREVIEW_URL: '../ELaering-Player/index.html',

  renderPreviewNode: function(node) {
    if (!Array.isArray(node.choices)) node.choices = [];
    this.previewState.currentNode = node;

    var body = document.getElementById('previewBody');
    var self = this;

    var iframe = document.getElementById('previewPlayerFrame');
    if (!iframe) {
      body.innerHTML = '<iframe id="previewPlayerFrame" title="Live preview" style="width:100%; height:100%; min-height:480px; border:0; border-radius:8px; background:#000; display:block;" allow="autoplay"></iframe>';
      iframe = document.getElementById('previewPlayerFrame');
      this._previewLoaded = false;
      iframe.addEventListener('load', function() { self._sendPreviewLoad(node); });
      // Sibling-checkout path, same assumption relay.py already makes about
      // where these three repos sit relative to each other on disk.
      iframe.src = this.PLAYER_PREVIEW_URL;
    } else if (this._previewLoaded) {
      iframe.contentWindow.postMessage({ type: 'lxrPreviewGoto', nodeId: node.id }, '*');
    }
    // else: iframe exists but hasn't fired 'load' yet — its own load handler
    // will call _sendPreviewLoad() with whatever node is current by then.

    this._refreshPreviewNav(node);
  },

  // Hands the embedded Player everything it needs to render on its own:
  // the whole scenario (so choice-clicking inside the iframe can navigate
  // exactly like production) plus the real asset Blobs. Sent once per
  // preview session (fresh iframe); after that, navigation is a cheap
  // lxrPreviewGoto and edits are a cheap lxrPreviewUpdateNode.
  _sendPreviewLoad: function(node) {
    var iframe = document.getElementById('previewPlayerFrame');
    if (!iframe || !iframe.contentWindow) return;
    var assets = [];
    // Send the ALREADY-MINTED blob: URL strings (v.url / i.url, created once
    // at upload time), not the underlying Blob/File objects. Per the File API
    // spec a blob: URL is usable by any document that shares its origin, not
    // just the document that minted it -- which is exactly this case, since
    // the embedded Player is loaded from the Builder's own origin (or the
    // matching sibling path on the same disk). Sending the Blob itself
    // instead (structured-cloning it across the postMessage boundary) LOOKED
    // right and passed a byte-for-byte integrity check, but a fresh
    // <video> given a blob: URL minted from a cross-realm-transferred Blob
    // silently refused to ever leave readyState 0 in testing -- a real
    // Chromium quirk with the media pipeline specifically, not a mistake in
    // the transfer. Sharing the URL string sidesteps that path entirely.
    (this.project.assets.videos || []).forEach(function(v) { if (v.url) assets.push({ id: v.id, url: v.url }); });
    (this.project.assets.images || []).forEach(function(i) { if (i.url) assets.push({ id: i.id, url: i.url }); });
    (this.project.assets.audio || []).forEach(function(a) { if (a.url) assets.push({ id: a.id, url: a.url }); });
    var scenario = {
      title: this.project.title,
      startNode: node.id, // preview always begins at whichever node the author is looking at, not the scenario's official start node
      gazeDwellSec: this.project.gazeDwellSec,
      nodes: this.project.nodes,
      // Projection (spec ID:01_07) is a per-asset property, not carried by the node
      // itself — the embedded Player needs this lookup table to render 180°
      // footage correctly in Preview, not just after a real export.
      assets: { videos: this.project.assets.videos.map(function(v) { return { id: v.id, projection: v.projection }; }) }
    };
    iframe.contentWindow.postMessage({ type: 'lxrPreviewLoad', scenario: scenario, assets: assets }, '*');
    this._previewLoaded = true;
    this._startPreviewLiveSync();
  },

  // Any edit to the node currently on screen in the preview — question text,
  // choice labels/colours/positions, overlays, anything — should show up
  // live without the author having to click Restart. Polling the live
  // project data for the previewed node (instead of hooking every single
  // updateNodeProp/updateChoiceProp/overlay-editing function individually)
  // means no future editing feature can silently forget to wire this up.
  _startPreviewLiveSync: function() {
    var self = this;
    this._stopPreviewLiveSync();
    this._previewLastNodeJSON = JSON.stringify(this.previewState.currentNode);
    this._previewLiveSyncTimer = setInterval(function() {
      if (!self.previewState || !self.previewState.currentNode) return;
      var node = self.project.nodes.find(function(n) { return n.id === self.previewState.currentNode.id; });
      if (!node) return;
      var json = JSON.stringify(node);
      if (json !== self._previewLastNodeJSON) {
        self._previewLastNodeJSON = json;
        var iframe = document.getElementById('previewPlayerFrame');
        if (iframe && iframe.contentWindow) {
          iframe.contentWindow.postMessage({ type: 'lxrPreviewUpdateNode', node: node }, '*');
        }
      }
    }, 400);
  },

  _stopPreviewLiveSync: function() {
    if (this._previewLiveSyncTimer) { clearInterval(this._previewLiveSyncTimer); this._previewLiveSyncTimer = null; }
    this._previewLastNodeJSON = null;
  },

  // Called both right after rendering a node ourselves, and when the embedded
  // Player tells us (via lxrPreviewNode) that gaze/click navigation inside
  // the iframe moved to a different node — so Back/Restart/Continue stay
  // correct no matter which side actually drove the navigation.
  _refreshPreviewNav: function(node) {
    var nav = document.getElementById('previewNav');
    if (!nav) return;
    var navHtml = '';
    if (this.previewState.history.length > 0) {
      navHtml += '<button class="btn secondary" onclick="App.previewBack()">← Back</button>';
    }
    if (node.type === 'end') {
      navHtml += '<button class="btn" onclick="App.restartPreview()">Restart</button>';
    } else if (!node.choices || node.choices.length === 0) {
      if (node.defaultNext) {
        navHtml += '<button class="btn" onclick="App.previewNext()">Continue →</button>';
      }
    }
    nav.innerHTML = navHtml;
  },

  // Messages FROM the embedded Player (postMessage from previewPlayerFrame).
  _onPreviewFrameMessage: function(msg) {
    if (!this.previewState) return;
    if (msg.type === 'lxrPreviewNode') {
      var node = this.project.nodes.find(function(n) { return n.id === msg.nodeId; });
      if (!node) return;
      var cur = this.previewState.currentNode;
      if (!cur || cur.id !== node.id) {
        if (cur) this.previewState.history.push(cur.id);
        this.previewState.currentNode = node;
        this._refreshPreviewNav(node);
        this._startPreviewLiveSync(); // rebase the live-edit diff onto the node now on screen
      }
    } else if (msg.type === 'lxrPreviewEnded') {
      // The embedded Player finished a run and reverted to its own raw
      // upload/setup screen underneath (nothing left to preview at that
      // point) -- that screen must never sit visible inside the Builder, so
      // stop here and close the whole panel rather than leave it showing.
      this.closePreview();
    }
  },
  
  handlePreviewChoice: function(node, idx, choiceEl) {
    var choice = node.choices[idx];
    choiceEl.classList.add(choice.correct ? 'correct' : 'incorrect');
    
    var self = this;
    setTimeout(function() {
      self.previewState.history.push(node.id);
      var nextId = choice.target || node.defaultNext;
      if(nextId) {
        var nextNode = self.project.nodes.find(n => n.id === nextId);
        if(nextNode) {
          self.renderPreviewNode(nextNode);
          return;
        }
      }
      self.closePreview();
    }, 800);
  },
  
  previewNext: function() {
    var cn = this.previewState.currentNode;
    if(!cn || !cn.defaultNext) return;
    this.previewState.history.push(cn.id);
    var nextNode = this.project.nodes.find(n => n.id === cn.defaultNext);
    if(nextNode) {
      this.previewState.currentNode = nextNode;
      this.renderPreviewNode(nextNode);
    }
  },
  
  previewBack: function() {
    if(this.previewState.history.length === 0) return;
    var prevId = this.previewState.history.pop();
    var prevNode = this.project.nodes.find(n => n.id === prevId);
    if(prevNode) {
      this.previewState.currentNode = prevNode;
      this.renderPreviewNode(prevNode);
    }
  },
  
  restartPreview: function() {
    var startNode = this.project.nodes.find(n => n.id === this.project.startNode);
    if(startNode) {
      this.previewState.history = [];
      this.renderPreviewNode(startNode);
    }
  },
  
  cleanupPreviewTimers: function() {
    if(this.previewState.overlayTimer) {
      clearInterval(this.previewState.overlayTimer);
      this.previewState.overlayTimer = null;
    }
    var videoEl = document.getElementById('previewVideo');
    if (videoEl) {
        // Fully release the decoder — critical when stepping through many clips,
        // otherwise the browser hits its simultaneous-decode cap and later videos
        // silently refuse to play.
        try { videoEl.pause(); videoEl.removeAttribute('src'); videoEl.load(); } catch(e){}
    }
    this.previewState.videoFailed = false;
    this._stopPreviewLiveSync();
  },

  closePreview: function() {
    document.getElementById('previewModal').classList.remove('show');
    this.cleanupPreviewTimers();
    // Tear the embedded Player right down (releases its video decoder/WebGL
    // context too) so the NEXT Preview open always starts a clean session —
    // matches how clicking the top-level "Preview" button already always
    // meant "start over from the top" before this change.
    var iframe = document.getElementById('previewPlayerFrame');
    if (iframe) iframe.remove();
    this._previewLoaded = false;
  },

  // FIX #7 — in-page filename prompt. window.prompt() is blocked in sandboxed
  // iframes (and some embedded webviews), which silently killed export there. This
  // is a small in-page dialog that works everywhere.
  askFilename: function(message, defaultName) {
    return new Promise(function(resolve){
      var back = document.createElement('div');
      back.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:3000';
      var box = document.createElement('div');
      box.style.cssText = 'background:var(--surface);border-radius:12px;padding:20px;width:90%;max-width:380px;box-shadow:var(--shadow-lg)';
      box.innerHTML = '<h3 style="font-size:15px;font-weight:600;margin-bottom:10px">' + esc(message) + '</h3>';
      var input = document.createElement('input');
      input.type = 'text'; input.value = defaultName;
      input.style.cssText = 'width:100%;margin-bottom:14px';
      box.appendChild(input);
      var row = document.createElement('div');
      row.style.cssText = 'display:flex;gap:8px;justify-content:flex-end';
      var cancel = document.createElement('button'); cancel.className = 'btn secondary mini'; cancel.textContent = 'Cancel';
      var ok = document.createElement('button'); ok.className = 'btn mini'; ok.textContent = 'Save';
      row.appendChild(cancel); row.appendChild(ok); box.appendChild(row);
      back.appendChild(box); document.body.appendChild(back);
      input.focus(); input.select();
      var done = function(val){ if (back.parentNode) document.body.removeChild(back); resolve(val); };
      cancel.onclick = function(){ done(null); };
      ok.onclick = function(){ done(input.value); };
      input.addEventListener('keydown', function(e){ if(e.key==='Enter') done(input.value); if(e.key==='Escape') done(null); });
      back.addEventListener('mousedown', function(e){ if(e.target === back) done(null); });
    });
  },

  // ---- REAL SAVES & EXPORTS ----
  save: async function(isExport) {
    isExport = !!isExport;
    var ext = isExport ? '.zip' : '.lxr';
    var defaultName = this.project.title.replace(/[^a-z0-9]/gi, '_') + ext;
    var promptMsg = isExport ? 'Enter export filename:' : 'Enter filename for your project:';
    var fileName = await this.askFilename(promptMsg, defaultName);
    
    if(!fileName) return;
    if(!fileName.endsWith(ext)) fileName += ext;
    
    this.showLoader(true, 'Packaging… reading media safely');

    // FIX #5 (Export "hangs forever" with no error): everything below used to
    // start with `var zip = new JSZip()` OUTSIDE this function's try/catch —
    // if JSZip failed to load (script blocked, CDN hiccup, stale cache after
    // an update) that line threw a plain uncaught ReferenceError, which
    // aborted this async function silently. The loader shown one line above
    // had no matching showLoader(false) on that path, so it just sat on
    // "Packaging…" forever with no way out except reloading the page and
    // losing any unsaved work. The fix is simply: nothing that can throw runs
    // before the try block starts.
    try {
      var zip = new JSZip();

      // project.json carries no binaries: strip File blobs AND base64 thumbs
      // (thumbs are written as .thumb.jpg sidecars, so keeping them here would
      // store every thumbnail twice and bloat the manifest).
      var projectData = JSON.parse(JSON.stringify(this.project, function(k, v){
        return (k === 'fileObj' || k === 'thumb') ? undefined : v;
      }));
      projectData.assets.videos.forEach(function(v){ delete v.data; delete v.url; v.file = 'videos/' + v.id + '_' + v.name.replace(/[\\/]/g,'_'); });
      projectData.assets.images.forEach(function(i){ delete i.data; delete i.url; i.file = 'images/' + i.id + '_' + i.name.replace(/[\\/]/g,'_'); });
      (projectData.assets.audio || []).forEach(function(a){ delete a.data; delete a.url; a.file = 'audio/' + a.id + '_' + a.name.replace(/[\\/]/g,'_'); });

      var videosFolder = zip.folder('videos');
      var imagesFolder = zip.folder('images');
      var audioFolder = zip.folder('audio');
      var missing = [];

      // Resolve a *verified-readable* Blob for an asset. Returns null if unreadable.
      // The slice(0,1) probe is the key fix: it catches a stale/garbage File handle
      // BEFORE generateAsync, so one dead clip reports its name and is skipped instead
      // of throwing "Can't read the data of videos/...mp4" and killing the whole export.
      var resolveBlob = async function(a){
        var blob = null;
        if (a.fileObj instanceof Blob) {
          blob = a.fileObj;
        } else if (typeof a.url === 'string' && /^(blob:|https?:)/.test(a.url)) {
          try { blob = await (await fetch(a.url)).blob(); } catch(e){ blob = null; }
        } else if (typeof a.data === 'string' && a.data.indexOf('base64,') > -1) {
          try {
            var bin = atob(a.data.split('base64,')[1]);
            var u8 = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
            blob = new Blob([u8]);
          } catch(e){ blob = null; }
        }
        if (!blob) return null;
        try { await blob.slice(0, 1).arrayBuffer(); } catch(e){ return null; }
        return blob;
      };

      var vids = this.project.assets.videos;
      for (var vi = 0; vi < vids.length; vi++) {
        var v = vids[vi];
        this.showLoader(true, 'Reading video ' + (vi + 1) + '/' + vids.length + ': ' + v.name);
        var vblob = await resolveBlob(v);
        var vpath = v.id + '_' + v.name.replace(/[\\/]/g,'_');
        if (vblob) {
          videosFolder.file(vpath, vblob);
          if (v.thumb && v.thumb.indexOf('base64,') > -1) {
            videosFolder.file(vpath + '.thumb.jpg', v.thumb.split('base64,')[1], { base64: true });
          }
        } else {
          missing.push(v.name);
        }
      }

      var imgs = this.project.assets.images;
      for (var ii = 0; ii < imgs.length; ii++) {
        var im = imgs[ii];
        var iblob = await resolveBlob(im);
        var ipath = im.id + '_' + im.name.replace(/[\\/]/g,'_');
        if (iblob) imagesFolder.file(ipath, iblob);
        else missing.push(im.name);
      }

      var auds = this.project.assets.audio || [];
      for (var ai = 0; ai < auds.length; ai++) {
        var au = auds[ai];
        var ablob = await resolveBlob(au);
        var apath = au.id + '_' + au.name.replace(/[\\/]/g,'_');
        if (ablob) audioFolder.file(apath, ablob);
        else missing.push(au.name);
      }

      var totalAssets = vids.length + imgs.length + auds.length;
      if (totalAssets > 0 && missing.length === totalAssets) {
        this.showLoader(false);
        alert("None of the media could be read.\n\nThis almost always means the project was reopened after a page reload — browsers can't keep video files in memory across reloads.\n\nUse Load to reopen your saved .zip, then export again.");
        return;
      }

      zip.file('project.json', JSON.stringify(projectData, null, 2));

      // STORE (no deflate): mp4/webm/jpg/png are already compressed, so deflating 13
      // large clips just burns CPU + RAM for ~0% gain — a big part of why export
      // choked on large projects. streamFiles keeps peak memory down.
      var blobOut = await zip.generateAsync({ type: 'blob', streamFiles: true, compression: 'STORE' });

      var a = document.createElement('a');
      a.href = URL.createObjectURL(blobOut);
      a.download = fileName;
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);

      this.showLoader(false);
      if (missing.length) {
        this.showStatus('Saved — ' + missing.length + ' unreadable file(s) skipped');
        alert("Saved, but these files couldn't be read and were left out:\n\n• " + missing.join("\n• ") + "\n\nRe-add them in Assets (or Load the original .zip), then export again.");
      } else {
        this.showStatus('Saved as ' + fileName);
      }
    } catch(err) {
      this.showLoader(false);
      console.error('Export/save failed:', err);
      var reason = (err && err.message) ? err.message : String(err);
      var hint = '';
      if (typeof JSZip === 'undefined' || /JSZip/i.test(reason)) {
        hint = "\n\nThe zip engine didn't load — check your internet connection (or the vendor/jszip.min.js file if self-hosted) and try again.";
      } else if (/quota|storage/i.test(reason)) {
        hint = "\n\nYour browser may be out of storage space for a project this large. Freeing up disk space or exporting fewer/smaller videos at once may help.";
      } else {
        hint = "\n\nNothing was saved. Your project is still open and unchanged — try again, and if it keeps failing, use Save (.lxr) instead of Export while you report this.";
      }
      alert('Could not finish exporting: ' + reason + hint);
    }
  },
  
  load: function() { document.getElementById('loader').click(); },
  
  loadFile: function(e) {
    var file = e.target.files[0];
    if(!file) return;
    
    var self = this;
    this.showLoader(true, 'Extracting project files...');
    
    var reader = new FileReader();
    reader.onload = function(evt) {
      JSZip.loadAsync(evt.target.result).then(function(zip) {
        // §6.3 — basic zip-bomb / malformed-file guard before touching anything.
        if (Object.keys(zip.files).length > 500) { self.showLoader(false); alert('This .zip has too many files.'); return; }
        var pj = zip.file('project.json');
        if (!pj) { self.showLoader(false); alert('Not an E-Læring project — no project.json in the .zip.'); return; }
        pj.async('string').then(function(projectStr) {
          var loadedProject = JSON.parse(projectStr);
          if (!loadedProject || typeof loadedProject !== 'object' || !Array.isArray(loadedProject.nodes) || !loadedProject.startNode) {
            throw new Error('invalid');
          }
          if (!loadedProject.assets) loadedProject.assets = { videos: [], images: [], audio: [] };
          if (!loadedProject.assets.videos) loadedProject.assets.videos = [];
          if (!loadedProject.assets.images) loadedProject.assets.images = [];
          if (!loadedProject.assets.audio) loadedProject.assets.audio = [];
          var promises = [];
          var missing = [];

          loadedProject.assets.videos.forEach(function(video) {
            // Only resolve the asset if its declared path stays inside videos/ (§6.3).
            var vsafe = safeZipPath(video.file, 'videos/');
            var f = vsafe ? zip.file(vsafe) : null;
            if(f) {
                var p = f.async('blob').then(function(blob) {
                    // Derive MIME from the extension instead of hardcoding mp4,
                    // so WebM/MOV clips decode correctly.
                    var vext = (video.name.split('.').pop() || '').toLowerCase();
                    var vmime = vext === 'webm' ? 'video/webm' : (vext === 'mov' ? 'video/quicktime' : 'video/mp4');
                    video.fileObj = new File([blob], video.name, { type: vmime });
                    video.url = URL.createObjectURL(video.fileObj);
                    var thumbFile = zip.file(video.file + '.thumb.jpg');
                    if(thumbFile) {
                        return thumbFile.async('base64').then(function(thumbData) {
                            video.thumb = 'data:image/jpeg;base64,' + thumbData;
                        });
                    } else {
                        return self.generateThumb(video.url).then(t => { video.thumb = t; });
                    }
                });
                promises.push(p);
            } else {
                missing.push(video.name);
            }
          });
          
          loadedProject.assets.images.forEach(function(img) {
            var isafe = safeZipPath(img.file, 'images/');
            var f = isafe ? zip.file(isafe) : null;
            if(f) {
                var mimeType = img.name.endsWith('.png') ? 'image/png' : 'image/jpeg';
                var p = f.async('blob').then(function(blob) {
                    img.fileObj = new File([blob], img.name, {type: mimeType});
                    img.url = URL.createObjectURL(img.fileObj);
                });
                promises.push(p);
            } else {
                missing.push(img.name);
            }
          });

          loadedProject.assets.audio.forEach(function(a) {
            var asafe = safeZipPath(a.file, 'audio/');
            var f = asafe ? zip.file(asafe) : null;
            if(f) {
                var aext = (a.name.split('.').pop() || '').toLowerCase();
                var amime = aext === 'wav' ? 'audio/wav' : aext === 'ogg' ? 'audio/ogg' : 'audio/mpeg';
                var p = f.async('blob').then(function(blob) {
                    a.fileObj = new File([blob], a.name, { type: amime });
                    a.url = URL.createObjectURL(a.fileObj);
                });
                promises.push(p);
            } else {
                missing.push(a.name);
            }
          });

          Promise.all(promises).then(function() {
            // BACKWARD COMPATIBILITY Upgrades
            loadedProject.nodes.forEach(function(node) {
              if(!node.textOverlays) node.textOverlays = [];
              // FIX #5: hand-edited / foreign files can ship a question with no
              // choices array — node.choices.length would throw in the inspector
              // and node.choices.forEach in the preview. Our own exports always
              // write choices: [], so this only fires on foreign data.
              if(!Array.isArray(node.choices)) node.choices = [];
              if(!node.imageOverlays) {
                  if(node.images && node.images.length > 0 && typeof node.images[0] === 'string') {
                      node.imageOverlays = node.images.map(imgId => ({ imageId: imgId, time: 0, duration: 5, x: 50, y: 50, scale: 1 }));
                  } else {
                      node.imageOverlays = [];
                  }
                  delete node.images;
              }
              if(!node.defaultNext && node.nextNode) { node.defaultNext = node.nextNode; delete node.nextNode; }
            });

            // FIX #6.1 — coerce/validate every untrusted numeric & colour field so a
            // crafted project.json can never inject anything into the inspector HTML
            // or the preview styles. Done before the project reaches the DOM.
            sanitizeProject(loadedProject);

            // Bug 6: release the OUTGOING project's object URLs before we drop it,
            // otherwise opening several .zip projects in one session leaks memory.
            (self.project.assets.videos || []).forEach(function(v){
              if (v.url && v.url.indexOf('blob:') === 0) URL.revokeObjectURL(v.url);
            });
            (self.project.assets.images || []).forEach(function(i){
              if (i.url && i.url.indexOf('blob:') === 0) URL.revokeObjectURL(i.url);
            });
            (self.project.assets.audio || []).forEach(function(a){
              if (a.url && a.url.indexOf('blob:') === 0) URL.revokeObjectURL(a.url);
            });

            self.project = loadedProject;
            self._assetsNeedRelink = missing.length > 0;
            document.getElementById('projectTitle').value = self.project.title;
            document.getElementById('projectAccessCode').value = self.project.accessCode || '';
            
            self.renderCanvas();
            self.updateStats();
            self.updateAssetLists();
            self.deselect();

            // FIX #3: frame the whole imported graph immediately.
            self.fitView();
            
            // Reset history stack
            self.history = [];
            self.historyIndex = -1;
            self.saveState();
            
            self.showLoader(false);
            // Bug 8: don't fail silently when the manifest references files the zip lacks.
            if (missing.length) {
              self.showStatus(missing.length + ' asset(s) missing from the project file');
              alert("These files were referenced but not found in the .zip:\n\n• " + missing.join("\n• "));
            } else {
              self.showStatus('Project loaded successfully');
            }
          });
        }).catch(function(err) {
          self.showLoader(false);
          alert('Invalid project structure');
        });
      }).catch(function(err) {
        self.showLoader(false);
        alert('Could not read ZIP file');
      });
    };
    reader.readAsArrayBuffer(file);
    e.target.value = '';
  },
  
  export: function() {
    // Identical to Save but enforcing a .zip extension
    return this.save(true);
  }
};

window.addEventListener('DOMContentLoaded', function() { App.init(); });
</script>
</body>
</html>
